<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ghostwriter Live Preview</title>
    <style id="custom-stylesheet"></style>
    <style>
        /* Base page wrapper layout spacing and scroll restoration */
        body {
            padding: 25px 35px !important;
            margin: 0 !important;
            box-sizing: border-box;
            overflow-y: auto !important; 
            min-height: 100vh;
        }

        /* WEBKIT/CHROMIUM LIVE PREVIEW SCROLLBAR WIDENING */
        ::-webkit-scrollbar {
            width: 20px !important; /* Widen this to 20px (Default is usually ~10px) */
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2); /* Subtle white thumb for dark mode matching */
            border-radius: 10px;
            border: 4px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.4); /* Brightens when you hover over it */
        }

        /* Markdown root element constraints */
        .markdown-body {
            max-width: 100% !important;
            margin: 0;
            line-height: 1.6;
        }
    </style>

    <!-- Load React Core Libraries sitting in the .qrc bundle -->
    <script src="qrc:///3rdparty/react/react.production.min.js"></script>
    <script src="qrc:///3rdparty/react/react-dom.production.min.js"></script>
    <script src="qrc:///3rdparty/react/html-react-parser.js"></script>
    
    <!-- Load Qt WebChannel Bridge -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    var proxy = channel.objects.previewProxy;
                    
                    // Universal React Component to safely parse and display Markdown HTML
                    function MarkdownPreviewApp() {
                        const [html, setHtml] = React.useState(proxy.htmlContent || "");

                        React.useEffect(() => {
                            // Listen for text update events from C++
                            const updateHandler = (newHtml) => setHtml(newHtml);
                            proxy.htmlChanged.connect(updateHandler);
                            
                            return () => {
                                proxy.htmlChanged.disconnect(updateHandler);
                            };
                        }, []);

                        // Safely parse dynamic markdown structures via html-react-parser
                        var parsedContent = window.HTMLReactParser && window.HTMLReactParser.default 
                            ? window.HTMLReactParser.default(html) 
                            : html;

                        return React.createElement('div', { className: 'markdown-body' }, parsedContent);
                    }

                    // UNIVERSAL VERSION RENDER ENGINE LINK (Fixes the white screen freeze)
                    var container = document.getElementById('react-root');
                    if (typeof ReactDOM.createRoot === 'function') {
                        ReactDOM.createRoot(container).render(React.createElement(MarkdownPreviewApp));
                    } else {
                        ReactDOM.render(React.createElement(MarkdownPreviewApp), container);
                    }

                    // Direct bridge link for styling sheets
                    proxy.styleSheetChanged.connect(function (css) {
                        document.getElementById('custom-stylesheet').innerHTML = css;
                    });
                    document.getElementById('custom-stylesheet').innerHTML = proxy.styleSheet;
                });
            }
        });
    </script>
</head>
<body>
    <div id="react-root"></div>
</body>
</html>
